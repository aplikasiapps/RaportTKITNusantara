<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Rapor TKIT Nusantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="login-section" class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-emerald">
        <div class="card p-4 shadow-lg text-center" style="width: 100%; max-width: 420px; border-radius: 16px;">
            <div class="mb-3">
                <i class="fa-solid fa-graduation-cap fa-3x text-warning"></i>
                <h3 class="text-emerald fw-bold mt-2">E-RAPOR DIGITAL</h3>
                <span class="badge bg-success-subtle text-success">TKIT Nusantara</span>
            </div>
            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username / NISN</label>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password / Tanggal Lahir</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-gold w-100 fw-bold text-dark py-2">MASUK</button>
            </form>
        </div>
    </div>

    <div id="app-section" class="d-none">
        <nav class="navbar navbar-dark bg-emerald px-3 shadow">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="fa-solid fa-child-reaching me-2"></i> TKIT NUSANTARA
            </a>
            <button class="btn btn-sm btn-light fw-bold" onclick="logout()">
                <i class="fa-solid fa-sign-out-alt"></i> Keluar
            </button>
        </nav>
        
        <div class="container mt-4" id="main-content">
            <div class="p-4 bg-white shadow-sm rounded-4 mb-4">
                <h4 id="welcome-msg" class="fw-bold text-emerald">Memuat Informasi Profil...</h4>
                <p class="text-muted mb-0">Sistem Informasi Penilaian Rapor Capaian Perkembangan Anak Didik.</p>
            </div>
            <div class="row" id="dashboard-stats">
                </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
